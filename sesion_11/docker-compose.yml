services:
  db:
    image: postgres:13 
    container_name: postgres_db
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: mysecretpassword 
    ports:
      - "5432:5432" 
    volumes:
      - db_data:/var/lib/postgresql/data 
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 

volumes:
  db_data: